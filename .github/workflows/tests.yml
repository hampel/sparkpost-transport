name: Tests

on:
  push:
  pull_request:
  # A dormant package still needs to hear about a new PHP release. Note that
  # GitHub disables scheduled workflows after 60 days without repository
  # activity, and emails before it does.
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }} ${{ matrix.deps }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      # The corners of the supported range, not the whole matrix. Everything between
      # fails only when a corner does.
      #
      # One job per Symfony major, because all three are declared and a declared version
      # that is never resolved is an unbacked promise. The floor takes --prefer-lowest,
      # which is the only thing that ever resolves the dev toolchain low.
      #
      # Symfony 7 gets both ends of the PHP range: it runs on 8.2 through 8.5, so it
      # spans the range this package supports and the top and bottom of that span are
      # different resolutions.
      matrix:
        include:
          - { php: '8.3', symfony: '^5.4', deps: '--prefer-lowest' }
          - { php: '8.3', symfony: '^6.4', deps: '' }
          - { php: '8.3', symfony: '^7.0', deps: '' }
          - { php: '8.5', symfony: '^7.0', deps: '' }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # --with, not `composer require`: it constrains within the declared range and
      # refuses to go outside it, so the matrix cannot drift away from composer.json
      # without the job failing.
      #
      # Name EVERY Symfony component in `require`, not just the two the package is
      # obviously about. --with only constrains what it is given, so an unnamed one
      # resolves free and the row reports a Symfony version it never ran: before
      # event-dispatcher was listed here, the ^6.4 row resolved it to 7.4. The ^5.4 row
      # got the right answer for the wrong reason, --prefer-lowest dragging everything
      # down, so it would have started lying the moment that flag moved.
      - run: >
          composer update
          --with="symfony/mailer:${{ matrix.symfony }}"
          --with="symfony/mime:${{ matrix.symfony }}"
          --with="symfony/event-dispatcher:${{ matrix.symfony }}"
          --prefer-dist --no-progress ${{ matrix.deps }}

      - run: vendor/bin/phpunit

      # Also here, not only in a job of its own: phpstan.neon covers the whole 8.3 - 8.5
      # PHP range in one pass wherever it runs, but its result still depends on the
      # dependency tree it resolved against - including phpstan's own version, which is
      # what the --prefer-lowest corner is for.
      - run: vendor/bin/phpstan analyse --no-progress

  dependencies:
    name: Declared dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none

      # Analyse src/ with the dev dependencies gone, so anything it calls that is not in
      # "require" comes back as not-found. Nothing else catches this: a normal PHPStan run
      # has guzzle and phpunit installed and sees nothing wrong, and the package would
      # fatal for the consumer instead. Guzzle is the live risk here - it is a dev
      # dependency, and a GuzzleHttp\ import in src/ would look entirely at home while
      # breaking every consumer that does not happen to have it.
      - run: composer install --no-dev --prefer-dist --no-progress

      # PHPStan is itself a dev dependency, so --no-dev just deleted it. It has to come
      # from outside the package. composer -d does not create the directory, so mkdir
      # first or the step dies with "Invalid working directory specified".
      - run: |
          mkdir -p /tmp/phpstan
          composer -d /tmp/phpstan require phpstan/phpstan --no-progress

      # -c is not optional. Without it PHPStan discovers the package's own phpstan.neon,
      # which points at tests/ and can no longer resolve PHPUnit - turning the run into a
      # configuration error while you are trying to read it as a dependency result.
      - run: >
          /tmp/phpstan/vendor/bin/phpstan analyse
          -c .github/phpstan-nodev.neon
          --autoload-file=vendor/autoload.php --no-progress

      # The step above cannot see a dependency that arrives transitively, and that is
      # structural rather than a gap to tune: --no-dev removes require-dev and nothing
      # else, so everything a DECLARED package drags in is still installed and every
      # symbol still resolves. hampel/sparkpost brings psr/http-client, psr/http-factory
      # and psr/http-message; a Psr\Http\Message\ call added to src/ passes the run above
      # and is undeclared. Verified both ways before this was added.
      #
      # composer-require-checker maps each symbol back to the package that supplies it and
      # fails on anything outside "require", so it reads what the code names rather than
      # what happens to be on disk. It is what found the three packages src/ imported and
      # composer.json did not, after a ten-phase audit had called this clean. It also names
      # an undeclared ext-*, which nothing else here covers - PHPStan knows the functions
      # from its own stubs and the suite passes because the runner has the extension.
      #
      # Reusing the --no-dev tree is convenient, not required: the known-symbol set comes
      # from what "require" names, so the answer is the same with the dev packages
      # installed, and it can be run by hand at any time without stripping anything.
      - run: |
          mkdir -p /tmp/crc
          composer -d /tmp/crc require maglnet/composer-require-checker --no-progress

      - run: /tmp/crc/vendor/bin/composer-require-checker check composer.json

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none

      - run: composer validate --strict

      - run: composer install --prefer-dist --no-progress

      - run: vendor/bin/pint --test
